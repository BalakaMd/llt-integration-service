version: '3.8'
services:
  integration-service:
    container_name: integration-service
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3003:3003'
    env_file:
      - .env
    depends_on:
      postgres_db:
          condition: service_healthy
      redis_cache:
          condition: service_started
    networks:
      - llt-net

  redis_cache:
    image: redis:7-alpine
    container_name: llt-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - llt-net

networks:
  llt-net:
    external: true
    name: llt-net

volumes:
  redis_data:
